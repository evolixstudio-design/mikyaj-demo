<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mikyaj · mobile review</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#eee9eb;color:#302a2c}header{padding:16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}select,a,button{font:inherit;padding:8px 12px;border:1px solid #cfc2c7;background:white;color:#5e3141;border-radius:6px;text-decoration:none}main{display:flex;justify-content:center;padding:0 12px 24px}iframe{width:390px;max-width:100%;height:calc(100dvh - 110px);min-height:480px;border:8px solid #292326;border-radius:28px;background:white;box-sizing:content-box;box-shadow:0 12px 40px #302a2c20}p{margin:0;text-align:center;font-size:12px;color:#675e61}</style></head><body><header><strong>Mikyaj mobile review</strong><label>Width <select id="width"><option>360</option><option selected>390</option><option>430</option></select></label><button data-url="/ar/">Arabic home</button><button data-url="/en/">English home</button><button data-url="/admin/login.html">Admin</button><a href="/en/" target="_blank">Open full browser ↗</a></header><main><iframe id="phone" title="Mobile storefront preview" src="/en/"></iframe></main><p>Local test storefront · choose Admin to sign in and review the management controls.</p><script>const phone=document.querySelector('#phone');document.querySelector('#width').onchange=e=>phone.style.width=e.target.value+'px';document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>phone.src=b.dataset.url);</script></body></html>
