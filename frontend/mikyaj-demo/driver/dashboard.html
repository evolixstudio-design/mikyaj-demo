<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Driver Dashboard — Mikyaj Kuwait</title>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    body { background: var(--surface-container-lowest); padding-bottom: 4rem; }
    .driver-header {
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .driver-name { font-weight: 600; font-size: 16px; }
    .driver-title { font-size: 12px; color: var(--outline); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .status-summary {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      background: var(--surface-container-lowest);
    }
    .status-chip {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--outline-variant);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      background: var(--surface);
      color: var(--on-surface-variant);
      transition: all 0.2s;
    }
    .status-chip.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }
    
    .order-list {
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .order-card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .order-number { font-weight: 700; font-size: 16px; color: var(--on-surface); }
    .order-time { font-size: 12px; color: var(--outline); }
    
    .order-info-row {
      display: flex;
      gap: 0.5rem;
      font-size: 14px;
      align-items: flex-start;
      color: var(--on-surface-variant);
    }
    .order-info-row .material-symbols-outlined {
      font-size: 18px;
      color: var(--outline);
      margin-top: 2px;
    }
    
    .order-actions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--outline);
    }
    
  </style>
</head>
<body>
  
  <header class="driver-header">
    <div>
      <div class="driver-name" id="driverName">Driver</div>
      <div class="driver-title">Mikyaj Delivery</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="logout(event)" title="Logout">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </header>
  
  <div class="status-summary">
    <div class="status-chip active" data-status="ALL" onclick="filterStatus('ALL')">All Assigned</div>
    <div class="status-chip" data-status="READY_FOR_DELIVERY" onclick="filterStatus('READY_FOR_DELIVERY')">Ready</div>
    <div class="status-chip" data-status="OUT_FOR_DELIVERY" onclick="filterStatus('OUT_FOR_DELIVERY')">Out for Delivery</div>
    <div class="status-chip" data-status="DELIVERED" onclick="filterStatus('DELIVERED')">Delivered</div>
  </div>

  <div id="loadingState" style="padding:4rem;text-align:center;color:var(--outline)">
    <span class="material-symbols-outlined" style="font-size:32px;animation:spin 1s linear infinite">sync</span>
    <div style="margin-top:1rem">Loading assigned orders...</div>
  </div>

  <div id="errorState" style="display:none;padding:4rem;text-align:center;color:var(--error)">
    <span class="material-symbols-outlined" style="font-size:32px">error</span>
    <div style="margin-top:1rem" id="errorMessage">Unable to load orders.</div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <span class="material-symbols-outlined" style="font-size:48px;margin-bottom:1rem">local_shipping</span>
    <div>No deliveries assigned.</div>
  </div>

  <div class="order-list" id="orderList">
    <!-- Order cards will be generated here -->
  </div>

  <script src="../js/api.js?v=5"></script>
  <script src="../js/app.js?v=5"></script>
  <script>
    let currentStatus = 'ALL';
    let allOrders = [];

    document.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('mikyaj_driver_session'));
      if (session && session.driver && session.driver.name) {
        document.getElementById('driverName').textContent = session.driver.name;
      }
      loadOrders();
    });

    function logout(e) {
      e.preventDefault();
      localStorage.removeItem('mikyaj_driver_session');
      window.location.href = 'login.html';
    }

    function filterStatus(status) {
      currentStatus = status;
      document.querySelectorAll('.status-chip').forEach(el => {
        el.classList.toggle('active', el.dataset.status === status);
      });
      renderOrders();
    }

    async function loadOrders() {
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('errorState').style.display = 'none';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('orderList').innerHTML = '';

      try {
        const data = await MikyajAPI.driverFetch('/driver/orders');
        allOrders = data.orders || [];
        document.getElementById('loadingState').style.display = 'none';
        renderOrders();
      } catch (err) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        if (err.status === 403) {
           document.getElementById('errorMessage').textContent = 'Your driver account is inactive. Contact an administrator.';
           // Clear session for inactive driver
           setTimeout(() => { logout({preventDefault:()=>{}}); }, 3000);
        } else {
           document.getElementById('errorMessage').textContent = err.message || 'Failed to load orders.';
        }
      }
    }

    function renderOrders() {
      const listEl = document.getElementById('orderList');
      listEl.innerHTML = '';
      
      const filtered = currentStatus === 'ALL' 
        ? allOrders 
        : allOrders.filter(o => o.status === currentStatus);
        
      if (filtered.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      
      document.getElementById('emptyState').style.display = 'none';
      
      const html = filtered.map(o => {
        const orderStatus = o.status || o.order_status || '';
        const sc = {
          'READY_FOR_DELIVERY': 'badge-primary',
          'OUT_FOR_DELIVERY': 'badge-warning',
          'DELIVERED': 'badge-success',
        }[orderStatus] || 'badge-outline';
        
        return `
          <div class="order-card">
            <div class="order-card-header">
              <div>
                <div class="order-number">${o.order_number}</div>
                <div class="order-time">${MikyajApp.formatDateTime(o.created_at)}</div>
              </div>
              <span class="badge ${sc}">${orderStatus ? orderStatus.replace(/_/g, ' ') : '—'}</span>
            </div>
            
            <div class="order-info-row" style="margin-top:0.5rem">
              <span class="material-symbols-outlined">person</span>
              <div>
                <div>${o.customer_name || 'Guest'}</div>
                <div style="font-size:13px"><a href="tel:${o.customer_phone}" style="color:var(--primary);text-decoration:none">${o.customer_phone}</a></div>
              </div>
            </div>
            
            <div class="order-info-row">
              <span class="material-symbols-outlined">location_on</span>
              <div>${o.customer_address || o.delivery_address || 'No address provided'}</div>
            </div>
            
            <div class="order-actions">
              <a href="order-detail.html?orderNumber=${o.order_number}" class="btn btn-outline" style="flex:1;justify-content:center">View Details</a>
            </div>
          </div>
        `;
      }).join('');
      
      listEl.innerHTML = html;
    }
  </script>
</body>
</html>
