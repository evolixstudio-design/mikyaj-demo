<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Result | Mikyaj Kuwait</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body class="bg-surface text-on-surface">

<header class="app-header glass-header" style="position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);border-bottom:1px solid var(--outline-variant);background:rgba(255,255,255,0.85)">
  <div class="container flex justify-between align-center" style="height:64px;padding:0 1rem">
    <div class="flex align-center gap-md">
      <a href="index.html" class="brand-text" style="font-size:1.25rem;font-weight:700;color:var(--on-surface);text-decoration:none;letter-spacing:-0.5px">MIKYAJ</a>
    </div>
    <div style="font-weight:600;font-size:0.9rem">Order Status</div>
  </div>
</header>

<main class="container" style="padding:4rem 1rem;max-width:600px;margin:0 auto;text-align:center">
  <div id="loadingState">
    <span class="material-symbols-outlined" style="font-size:4rem;color:var(--primary);animation:spin 1s linear infinite">sync</span>
    <h2 style="margin-top:1rem;font-size:1.5rem">Verifying payment...</h2>
    <p style="color:var(--on-surface-variant);margin-top:0.5rem">Please do not close this window.</p>
  </div>
  
  <div id="successState" style="display:none">
    <span class="material-symbols-outlined" style="font-size:4rem;color:green">check_circle</span>
    <h2 style="margin-top:1rem;font-size:1.5rem">Order Confirmed</h2>
    <p style="color:var(--on-surface-variant);margin-top:0.5rem" id="successOrderRef"></p>
    <div style="margin-top:2rem">
      <a href="index.html" class="btn btn-primary">Continue Shopping</a>
    </div>
  </div>
  
  <div id="errorState" style="display:none">
    <span class="material-symbols-outlined" style="font-size:4rem;color:red">error</span>
    <h2 style="margin-top:1rem;font-size:1.5rem">Payment Failed</h2>
    <p style="color:var(--on-surface-variant);margin-top:0.5rem" id="errorMsg">Your payment could not be completed.</p>
    <div style="margin-top:2rem;display:flex;gap:1rem;justify-content:center">
      <a href="checkout.html" class="btn btn-primary">Try Again</a>
      <a href="cart.html" class="btn btn-outline">Return to Cart</a>
    </div>
  </div>
</main>

<script src="js/store.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const orderNumber = params.get('order');
  const errorFlag = params.get('error');
  
  if (errorFlag || !orderNumber) {
    showError('We encountered an error while processing your payment.');
    return;
  }
  
  try {
    // Ping backend to get authoritative status
    const res = await fetch(`http://localhost:3000/api/payment/status/${orderNumber}`);
    if (!res.ok) throw new Error('Could not verify order status');
    const data = await res.json();
    
    if (data.status === 'CONFIRMED' || data.status === 'PAID') {
      showSuccess(`Your order ${data.order_number} has been placed successfully.`);
      MikyajStore.clearCart();
    } else if (data.status === 'PENDING_PAYMENT') {
      showError(`Your order ${data.order_number} has not been paid yet. Please try again.`);
    } else {
      showError(`Order status is ${data.status}. Please contact support.`);
    }
  } catch (err) {
    showError(err.message);
  }
});

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('successState').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('errorMsg').innerText = msg;
}

function showSuccess(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('successState').style.display = 'block';
  document.getElementById('successOrderRef').innerText = msg;
}
</script>
</body>
</html>
