<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Mikyaj Kuwait</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
</head>
<body class="bg-surface text-on-surface">

<!-- HEADER -->
<header class="app-header glass-header" style="position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);border-bottom:1px solid var(--outline-variant);background:rgba(255,255,255,0.85)">
  <div class="container flex justify-between align-center" style="height:64px;padding:0 1rem">
    <div class="flex align-center gap-md">
      <a href="cart.html" class="btn btn-icon"><span class="material-symbols-outlined">arrow_back</span></a>
      <a href="index.html" class="brand-text" style="font-size:1.25rem;font-weight:700;color:var(--on-surface);text-decoration:none;letter-spacing:-0.5px">MIKYAJ</a>
    </div>
    <div style="font-weight:600;font-size:0.9rem">Secure Checkout</div>
  </div>
</header>

<main class="container" style="padding:2rem 1rem;max-width:1000px;margin:0 auto">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem">
    
    <!-- LEFT: Checkout Form -->
    <div class="checkout-form">
      <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:1.5rem;letter-spacing:-0.5px">Delivery Details</h2>
      
      <form id="checkoutForm">
        <div class="form-group" style="margin-bottom:1rem">
          <label class="text-label" style="display:block;margin-bottom:4px">Full Name <span style="color:red">*</span></label>
          <input type="text" id="custName" required class="form-control" style="width:100%;padding:0.75rem;border:1px solid var(--outline);border-radius:8px;font-family:inherit" placeholder="e.g. John Doe">
        </div>
        
        <div class="form-group" style="margin-bottom:1rem">
          <label class="text-label" style="display:block;margin-bottom:4px">Phone Number <span style="color:red">*</span></label>
          <input type="tel" id="custPhone" required class="form-control" style="width:100%;padding:0.75rem;border:1px solid var(--outline);border-radius:8px;font-family:inherit" placeholder="+965 0000 0000">
        </div>
        
        <div class="form-group" style="margin-bottom:1rem">
          <label class="text-label" style="display:block;margin-bottom:4px">Email (Optional)</label>
          <input type="email" id="custEmail" class="form-control" style="width:100%;padding:0.75rem;border:1px solid var(--outline);border-radius:8px;font-family:inherit" placeholder="you@example.com">
        </div>
        
        <div class="form-group" style="margin-bottom:1.5rem">
          <label class="text-label" style="display:block;margin-bottom:4px">Delivery Address <span style="color:red">*</span></label>
          <textarea id="custAddress" required class="form-control" style="width:100%;padding:0.75rem;border:1px solid var(--outline);border-radius:8px;font-family:inherit;min-height:100px;resize:vertical" placeholder="Area, Block, Street, House/Building"></textarea>
        </div>
        
        <div class="payment-method-selector" style="margin-bottom:2rem">
          <h3 style="font-size:1.1rem;font-weight:600;margin-bottom:1rem">Payment Method</h3>
          <div style="border:1px solid var(--primary);border-radius:8px;padding:1rem;background:var(--primary-container);display:flex;align-items:center;gap:1rem">
            <input type="radio" id="payMyFatoorah" name="payment" value="MYFATOORAH" checked style="accent-color:var(--primary);width:20px;height:20px">
            <label for="payMyFatoorah" style="font-weight:600;color:var(--on-primary-container);cursor:pointer;flex:1">Pay with MyFatoorah (KNET / Visa)</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" style="width:100%">
          Place Order & Pay
        </button>
      </form>
    </div>
    
    <!-- RIGHT: Order Summary -->
    <div class="order-summary">
      <div class="card" style="padding:1.5rem;background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;position:sticky;top:80px">
        <h3 style="font-size:1.2rem;font-weight:700;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--outline-variant)">Order Summary</h3>
        
        <div id="checkoutItems" style="margin-bottom:1.5rem;display:flex;flex-direction:column;gap:1rem">
          <!-- Populated by JS -->
        </div>
        
        <div style="border-top:1px dashed var(--outline);padding-top:1rem">
          <div class="flex justify-between" style="margin-bottom:0.5rem;color:var(--on-surface-variant)">
            <span>Subtotal</span>
            <span id="summarySubtotal">0.000 KWD</span>
          </div>
          <div class="flex justify-between" style="margin-bottom:1rem;color:var(--on-surface-variant)">
            <span>Delivery</span>
            <span>0.000 KWD</span>
          </div>
          <div class="flex justify-between" style="font-size:1.25rem;font-weight:700;padding-top:1rem;border-top:1px solid var(--outline)">
            <span>Total</span>
            <span id="summaryTotal" style="color:var(--primary)">0.000 KWD</span>
          </div>
        </div>
      </div>
    </div>
    
  </div>
</main>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cart = MikyajStore.getCart();
  if (cart.length === 0) {
    window.location.href = 'cart.html';
    return;
  }
  
  renderSummary(cart);
  
  // Generate Idempotency Key on page load
  const idempotencyKey = crypto.randomUUID ? crypto.randomUUID() : 'idemp-' + Date.now() + '-' + Math.random();
  
  document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    
    // Prepare payload
    const payload = {
      idempotencyKey,
      customer: {
        name: document.getElementById('custName').value.trim(),
        phone: document.getElementById('custPhone').value.trim(),
        email: document.getElementById('custEmail').value.trim(),
        address: document.getElementById('custAddress').value.trim()
      },
      items: cart.map(i => ({ productId: i.productId, qty: i.qty }))
    };
    
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined" style="animation:spin 1s linear infinite">sync</span> Initiating Payment...';
    
    try {
      // API call to our new checkout endpoint
      const res = await fetch(`${MikyajAPI.BASE_URL}/checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      const data = await res.json();
      
      if (!res.ok) {
        throw new Error(data.error || 'Checkout failed');
      }
      
      // Success!
      // Cart will be cleared only after backend verification on the result page.
      
      // Redirect to MyFatoorah
      if (data.payment && data.payment.redirect_url) {
        window.location.href = data.payment.redirect_url;
      } else {
        throw new Error('Missing payment redirect URL');
      }
      
    } catch (err) {
      MikyajApp.showToast(err.message, 'error');
      btn.disabled = false;
      btn.innerText = 'Place Order & Pay';
    }
  });
});

function renderSummary(cart) {
  const container = document.getElementById('checkoutItems');
  let total = 0;
  
  container.innerHTML = cart.map(item => {
    const itemTotal = item.price * item.qty;
    total += itemTotal;
    const imgUrl = item.image ? (item.image.includes('http') ? item.image : `${MikyajAPI.BASE_URL}/images/${item.image}`) : 'https://placehold.co/100x100?text=No+Image';
    
    return `
      <div class="flex align-center gap-md">
        <img src="${imgUrl}" alt="Product" style="width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--outline-variant)">
        <div style="flex:1">
          <div class="text-body-sm" style="font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${item.name}</div>
          <div class="text-label" style="color:var(--on-surface-variant)">Qty: ${item.qty}</div>
        </div>
        <div style="font-weight:600;white-space:nowrap">${itemTotal.toFixed(3)} KWD</div>
      </div>
    `;
  }).join('');
  
  document.getElementById('summarySubtotal').innerText = total.toFixed(3) + ' KWD';
  document.getElementById('summaryTotal').innerText = total.toFixed(3) + ' KWD';
}
</script>
</body>
</html>
