[build]
  base = "frontend"
  publish = "mikyaj-demo"

[[redirects]]
  from = "/api/*"
  to = "https://mikyaj-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
